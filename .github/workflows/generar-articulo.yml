name: Generar artículo automático

"on":
  schedule:
    # Lunes y jueves a las 07:00 UTC. Cambia la expresión cron si quieres otro ritmo.
    - cron: "0 7 * * 1,4"
  workflow_dispatch: {}   # te deja lanzarlo a mano desde la pestaña "Actions"

permissions:
  contents: write
  pull-requests: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar artículo con IA
        id: generar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
          SITE_NICHE: ${{ secrets.SITE_NICHE }}
          CONTENT_LANGUAGE: ${{ secrets.CONTENT_LANGUAGE }}
        run: python generar_articulo.py

      - name: Abrir Pull Request para revisión
        if: steps.generar.outputs.ruta != ''
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Nuevo borrador: ${{ steps.generar.outputs.titulo }}"
          title: "Nuevo artículo generado: ${{ steps.generar.outputs.titulo }}"
          body: |
            Artículo generado automáticamente con IA a partir de `temas.csv`.

            Antes de fusionar (Merge):
            - Léelo por encima (5-10 min).
            - Corrige cualquier dato que suene inventado o genérico.
            - Si te convence, pulsa **Merge pull request** y quedará publicado.
          branch: "articulo-automatico/${{ github.run_number }}"
          add-paths: |
            _posts/*
            temas.csv
