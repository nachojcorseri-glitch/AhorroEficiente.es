title: "Ahorro Eficiente"
description: "Guías y comparativas para ahorrar en la factura de la luz, el gas y el consumo del hogar — now also in English"
theme: minima

collections:
  posts_en:
    output: true
    permalink: /en/:year/:month/:day/:title/

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /:year/:month/:day/:title/

# Archivos del repositorio que NO son parte de la web pública: Jekyll no debe
# convertirlos en páginas ni listarlos en la navegación.
exclude:
  - PROMPT-MAESTRO-NICHO.md
  - README.md
  - generar_articulo.py
  - requirements.txt
  - temas_es.csv
  - temas_en.csv

# Cambia el título y la descripción de arriba cuando quieras: es solo texto, sin coste ni riesgo.
author: "Ignacio"
# twitter_username: tuusuario
# github_username:  tuusuario

